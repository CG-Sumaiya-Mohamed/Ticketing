# Tiny API gateway for docker-compose. It plays the same role as ingress-nginx does in Kubernetes.
events {}

http {
  # Needed so the Next.js dev server's hot-reload websocket works through the gateway.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _; # Accept any host (localhost:8080 from the browser, "gateway" from the client container).

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Most specific paths first, just like in ingress-srv.yaml.
    location /api/users/   { proxy_pass http://auth:3000; }
    location /api/tickets  { proxy_pass http://tickets:3000; }
    location /api/orders   { proxy_pass http://orders:3000; }

    # Catch all: everything else goes to the Next.js client.
    location / {
      proxy_pass http://client:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
