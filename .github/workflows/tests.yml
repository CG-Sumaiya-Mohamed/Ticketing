# This code will configure the github action
# name workflow
name: tests

# this determines when we are going to run this workflow
on:
  pull_request #create, update or re-open

jobs:
  build:
    runs-on: windows # operating system
    steps:
      - uses: actions/checkout@v2
      - run: cd auth && npm install && npm run test:ci # will run jest but we only want one run and then an exit not all the tests running, this script will be created in the repo for this pipleing onlyu to run the test suite one time and then exit automatically.
