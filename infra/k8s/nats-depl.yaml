apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-depl
  namespace: mini-ticketing
spec:
  replicas: 1 # One NATS Streaming server.
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats-streaming:0.17.0 # Same version as the course app.
          # -p client port, -m monitoring port, -hb* heartbeats (drop dead clients fast), -SD debug logs, -cid cluster id.
          args: ["-p", "4222", "-m", "8222", "-hbi", "5s", "-hbt", "5s", "-hbf", "2", "-SD", "-cid", "mini-ticketing"]
---
apiVersion: v1
kind: Service
metadata:
  name: nats-srv
  namespace: mini-ticketing
spec:
  selector:
    app: nats
  ports:
    - name: client
      protocol: TCP
      port: 4222
      targetPort: 4222
    - name: monitoring
      protocol: TCP
      port: 8222
      targetPort: 8222
